x-zalo-logging: &zalo-logging
  driver: json-file
  options:
    max-file: "5"
    max-size: "20m"

services:
  # One-shot bootstrap helpers. They are profile-gated and are invoked only by
  # the guarded deployment script with `run --rm --no-deps`.
  zalo-database-init:
    image: timescale/timescaledb-ha:pg18.4-ts2.27.2-all
    profiles: [bootstrap]
    restart: "no"
    networks:
      - app
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-chatbotx}
      POSTGRES_USER: ${POSTGRES_USER:-chatbotx}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      ZALO_DB_NAME: ${ZALO_DB_NAME:-zalo_personal}
      ZALO_DB_USER: ${ZALO_DB_USER:-zalo_personal}
      ZALO_DB_PASSWORD: ${ZALO_DB_PASSWORD:?Set ZALO_DB_PASSWORD in .env}
      ZALO_DB_CONNECTION_LIMIT: ${ZALO_DB_CONNECTION_LIMIT:-30}
    volumes:
      - ./scripts/docker/zalo-personal/init-database.sh:/usr/local/bin/init-zalo-database:ro
    entrypoint: [/bin/sh, /usr/local/bin/init-zalo-database]
    logging: *zalo-logging

  zalo-personal-gateway:
    image: chatbotx-zalo-personal:${CHATBOTX_ZALO_PERSONAL_IMAGE_TAG:-local}
    restart: unless-stopped
    init: true
    command: [node, dist/gateway.js]
    networks:
      - app
    environment:
      NODE_ENV: production
      DATABASE_URL: ${ZALO_DATABASE_URL:?Set encoded ZALO_DATABASE_URL in .env}
      REDIS_URL: ${ZALO_REDIS_URL:-redis://redis:6379/1}
      ENCRYPTION_KEY: ${ZALO_ENCRYPTION_KEY:?Set ZALO_ENCRYPTION_KEY in .env}
      ZALO_GATEWAY_CREDENTIAL_KEY: ${ZALO_GATEWAY_CREDENTIAL_KEY:?Set ZALO_GATEWAY_CREDENTIAL_KEY in .env}
      STORAGE_DRIVER: r2
      S3_ENDPOINT: http://filesystem:9000
      S3_PUBLIC_URL: ${ZALO_S3_PUBLIC_URL:?Set ZALO_S3_PUBLIC_URL in .env}
      S3_BUCKET: ${ZALO_S3_BUCKET:-zalocrm-attachments}
      S3_REGION: ${ZALO_S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${ZALO_S3_ACCESS_KEY_ID:?Set ZALO_S3_ACCESS_KEY_ID in .env}
      S3_SECRET_KEY: ${ZALO_S3_SECRET_ACCESS_KEY:?Set ZALO_S3_SECRET_ACCESS_KEY in .env}
      ZALO_PERSONAL_PROVIDER_MODE: gateway
      ZALO_PERSONAL_RUNTIME_ROLE: gateway
      ZALO_GATEWAY_CLAIMS_ENABLED: ${ZALO_GATEWAY_CLAIMS_ENABLED:-false}
      ZALO_GATEWAY_COMMAND_CLAIMS_ENABLED: ${ZALO_GATEWAY_COMMAND_CLAIMS_ENABLED:-false}
      ZALO_GATEWAY_ACCOUNT_ALLOWLIST: ${ZALO_GATEWAY_ACCOUNT_ALLOWLIST:-}
    volumes:
      - zalo-file-storage:/var/lib/zalo-crm/files
    tmpfs:
      - /tmp:size=256m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [CMD, test, -f, /tmp/zalo-gateway-ready]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 30s
    logging: *zalo-logging

  zalo-filesystem-init:
    image: rustfs/rc:v0.1.22
    profiles: [bootstrap]
    restart: "no"
    networks:
      - app
    environment:
      RUSTFS_ADMIN_ACCESS_KEY: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID in .env}
      RUSTFS_ADMIN_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in .env}
      CHATBOTX_S3_BUCKET: ${S3_BUCKET:-chatbotx}
      ZALO_S3_ACCESS_KEY_ID: ${ZALO_S3_ACCESS_KEY_ID:?Set ZALO_S3_ACCESS_KEY_ID in .env}
      ZALO_S3_SECRET_ACCESS_KEY: ${ZALO_S3_SECRET_ACCESS_KEY:?Set ZALO_S3_SECRET_ACCESS_KEY in .env}
      ZALO_S3_BUCKET: ${ZALO_S3_BUCKET:-zalocrm-attachments}
    volumes:
      - ./scripts/docker/zalo-personal/init-rustfs.sh:/usr/local/bin/init-rustfs:ro
      - ./scripts/docker/zalo-personal/rustfs-policy.json:/config/rustfs-policy.json:ro
    entrypoint: [/bin/sh, /usr/local/bin/init-rustfs]
    logging: *zalo-logging

  zalo-personal:
    image: chatbotx-zalo-personal:${CHATBOTX_ZALO_PERSONAL_IMAGE_TAG:-local}
    build:
      context: ./apps/zalo-personal
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    init: true
    networks:
      - app
    # Deliberately no depends_on: production deploys inspect shared services
    # and activate only this app with `up --no-deps`.
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      APP_URL: ${ZALO_APP_URL:?Set ZALO_APP_URL in .env}
      CRM_LOGIN_URL: ${ZALO_APP_URL:?Set ZALO_APP_URL in .env}
      JWT_SECRET: ${ZALO_JWT_SECRET:?Set ZALO_JWT_SECRET in .env}
      ENCRYPTION_KEY: ${ZALO_ENCRYPTION_KEY:?Set ZALO_ENCRYPTION_KEY in .env}
      ZALO_GATEWAY_CREDENTIAL_KEY: ${ZALO_GATEWAY_CREDENTIAL_KEY:?Set ZALO_GATEWAY_CREDENTIAL_KEY in .env}
      ZALO_BRIDGE_SECRET_KEY: ${ZALO_BRIDGE_SECRET_KEY:?Set ZALO_BRIDGE_SECRET_KEY in .env}
      ZALO_PERSONAL_PROVIDER_MODE: ${ZALO_PERSONAL_PROVIDER_MODE:-in_process}
      TOKEN_ENCRYPTION_KEY: ${ZALO_TOKEN_ENCRYPTION_KEY:-}
      FB_TOKEN_ENC_KEY: ${ZALO_FB_TOKEN_ENC_KEY:-}
      # URL must already percent-encode reserved characters in the password.
      DATABASE_URL: ${ZALO_DATABASE_URL:?Set encoded ZALO_DATABASE_URL in .env}
      REDIS_URL: ${ZALO_REDIS_URL:-redis://redis:6379/1}
      STORAGE_DRIVER: r2
      S3_ENDPOINT: http://filesystem:9000
      S3_PUBLIC_URL: ${ZALO_S3_PUBLIC_URL:?Set ZALO_S3_PUBLIC_URL in .env}
      S3_BUCKET: ${ZALO_S3_BUCKET:-zalocrm-attachments}
      S3_REGION: ${ZALO_S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${ZALO_S3_ACCESS_KEY_ID:?Set ZALO_S3_ACCESS_KEY_ID in .env}
      S3_SECRET_KEY: ${ZALO_S3_SECRET_ACCESS_KEY:?Set ZALO_S3_SECRET_ACCESS_KEY in .env}
      MEDIA_AV_ENABLED: ${ZALO_MEDIA_AV_ENABLED:-0}
      MEDIA_AV_FAIL_CLOSED: ${ZALO_MEDIA_AV_FAIL_CLOSED:-1}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      AUTOMATION_STUB_MODE: ${ZALO_AUTOMATION_STUB_MODE:-false}
      FRIEND_INVITE_TEST_MODE: "false"
    ports:
      - 127.0.0.1:${ZALO_APP_PORT:-3080}:3000
    volumes:
      - zalo-file-storage:/var/lib/zalo-crm/files
    tmpfs:
      - /tmp:size=256m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/v1/setup/status').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    stop_grace_period: 30s
    logging: *zalo-logging

volumes:
  # Compatibility mount retained through the evidence/retention window.
  zalo-file-storage:
