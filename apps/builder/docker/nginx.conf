map $http_x_forwarded_proto $public_proto {
  "" $scheme;
  default $http_x_forwarded_proto;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  "" close;
}

server {
  listen 80;
  client_max_body_size 21m;

  location ^~ /storage/ {
    proxy_pass http://filesystem:9000/chatbotx/;
    proxy_set_header Host filesystem:9000;
    proxy_buffering off;
  }

  location ^~ /ws/ {
    proxy_pass http://realtime:1999/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $public_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;
  }

  location / {
    proxy_pass http://builder:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $public_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}
