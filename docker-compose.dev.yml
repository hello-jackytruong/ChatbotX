name: chatbotx

include:
  - docker-compose.yml

x-service-common: &service-common
  platform: linux/amd64
  restart: unless-stopped
  env_file:
    - path: ./.env
      required: false
  extra_hosts:
    - "host.docker.internal:host-gateway"
  networks:
    - chatbotx-network

x-worker-common: &worker-common
  <<: *service-common
  build:
    context: .
    dockerfile: apps/worker/docker/Dockerfile

services:
  builder:
    <<: *service-common
    # image: chatbotx-builder:latest
    build:
      context: .
      # Local Docker uses Next.js dev mode so an 8 GiB Docker Desktop VM can
      # start the UI. Production keeps the standalone optimized Dockerfile.
      dockerfile: apps/builder/docker/Dockerfile.dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      filesystem:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://' + process.env.HOSTNAME + ':3000/api/health').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    environment:
      # Database changes are explicit through `pnpm docker:dev:prepare:chatbotx`.
      - RUN_DB_MIGRATE=false
      - RUN_DB_SEED=false
      # Local Docker must not inherit production-domain redirects from .env.
      - NODE_ENV=development
      - BETTER_AUTH_URL=http://localhost:3123
      - NEXT_PUBLIC_BUILDER_URL=http://localhost:3123
      - NEXT_PUBLIC_BROKER_URL=http://localhost:3123
      - NEXT_PUBLIC_INTERNAL_STORAGE_URL=http://localhost:9000/chatbotx/
      - FORCE_PUBLIC_HTTPS=false
      - MCP_PROXY_URL=http://host.docker.internal:3333
      - DATABASE_URL=postgresql://${POSTGRES_USER:-chatbotx}:${POSTGRES_PASSWORD:-secretkey}@postgres:5432/${POSTGRES_DB:-chatbotx}?schema=public
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT=http://filesystem:9000
      - ZALO_PERSONAL_BRIDGE_ALLOWED_ORIGINS=${ZALO_PERSONAL_BRIDGE_ALLOWED_ORIGINS:-http://zalo-personal:3000}

  gateway:
    platform: linux/amd64
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "3123:80"
    volumes:
      - ./apps/builder/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - chatbotx-network
    depends_on:
      builder:
        condition: service_healthy
      filesystem:
        condition: service_healthy
      realtime:
        condition: service_started

  # BullMQ Worker
  worker:
    <<: *worker-common
    networks:
      - chatbotx-network
      - javascript-executor-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      filesystem:
        condition: service_healthy
      javascript-executor:
        condition: service_healthy
    environment:
      - JAVASCRIPT_EXECUTOR_URL=http://javascript-executor:3210
      - DATABASE_URL=postgresql://${POSTGRES_USER:-chatbotx}:${POSTGRES_PASSWORD:-secretkey}@postgres:5432/${POSTGRES_DB:-chatbotx}?schema=public
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT=http://filesystem:9000
      - ZALO_PERSONAL_BRIDGE_ENABLED=${ZALO_PERSONAL_BRIDGE_ENABLED:-false}
      - ZALO_PERSONAL_BRIDGE_POLL_ENABLED=${ZALO_PERSONAL_BRIDGE_POLL_ENABLED:-false}
      - ZALO_PERSONAL_BRIDGE_OUTBOUND_ENABLED=${ZALO_PERSONAL_BRIDGE_OUTBOUND_ENABLED:-false}
      - ZALO_PERSONAL_BRIDGE_ACCOUNT_ALLOWLIST=${ZALO_PERSONAL_BRIDGE_ACCOUNT_ALLOWLIST:-}
      - ZALO_PERSONAL_BRIDGE_ALLOWED_ORIGINS=${ZALO_PERSONAL_BRIDGE_ALLOWED_ORIGINS:-http://zalo-personal:3000}

  javascript-executor:
    platform: linux/amd64
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/javascript-executor/docker/Dockerfile
    environment:
      JAVASCRIPT_EXECUTOR_TOKEN: ${JAVASCRIPT_EXECUTOR_TOKEN:-change-me-in-production-at-least-32-chars}
      MAX_CONCURRENCY: ${MAX_CONCURRENCY:-2}
    networks:
      - javascript-executor-network
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    pids_limit: 128
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 512M
          pids: 128
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3210/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  realtime:
    <<: *service-common
    build:
      context: .
      dockerfile: apps/realtime/docker/Dockerfile
    ports:
      - "1999:1999"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379/0
      NEXT_PUBLIC_BUILDER_URL: http://builder:3000
      REALTIME_BUILDER_URL: http://builder:3000

networks:
  javascript-executor-network:
    driver: bridge
    internal: true
