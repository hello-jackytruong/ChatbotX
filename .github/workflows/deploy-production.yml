name: Build and deploy production

on:
  push:
    branches: [dev]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

env:
  BUILD_PLATFORMS: linux/amd64
  DOCKER_REGISTRY: ghcr.io

jobs:
  check:
    name: Quality gate
    if: github.ref == 'refs/heads/dev'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  detect:
    name: Detect affected services
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: read
    outputs:
      has_services: ${{ steps.affected.outputs.has_services }}
      services: ${{ steps.affected.outputs.services }}
      matrix: ${{ steps.affected.outputs.matrix }}
      baseline_matrix: ${{ steps.affected.outputs.baseline_matrix }}
      chatbotx_services: ${{ steps.affected.outputs.chatbotx_services }}
      deploy_zalo: ${{ steps.affected.outputs.deploy_zalo }}
      full_deploy: ${{ steps.affected.outputs.full_deploy }}
      reason: ${{ steps.affected.outputs.reason }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Set up pnpm
        if: github.event_name == 'push'
        uses: pnpm/action-setup@v6.1.0

      - name: Set up Node.js
        if: github.event_name == 'push'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependency graph
        if: github.event_name == 'push'
        run: pnpm install --frozen-lockfile

      - name: Detect affected production services
        id: affected
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          detect_scope() {
            local scope="$1" environment="$2" output="$3" base_sha=""
            if [ "${{ github.event_name }}" = "push" ]; then
              base_sha="$(node scripts/deployment/detect-affected-services.mjs \
                --resolve-production-baseline \
                --github-repository "$GITHUB_REPOSITORY" \
                --environment "$environment" 2>/dev/null || true)"
            fi
            if [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]]; then
              git cat-file -e "$base_sha^{commit}" 2>/dev/null || \
                git fetch --no-tags --depth=1 origin "$base_sha" || base_sha=""
            else
              base_sha=""
            fi
            if [ -n "$base_sha" ]; then
              node scripts/deployment/detect-affected-services.mjs \
                --scope "$scope" --base "$base_sha" --head "$HEAD_SHA" >"$output"
            else
              echo "::warning::No successful $scope baseline; using the full $scope"
              node scripts/deployment/detect-affected-services.mjs \
                --scope "$scope" --full --head "$HEAD_SHA" >"$output"
            fi
          }

          detect_scope chatbotx production-chatbotx "$RUNNER_TEMP/chatbotx-scope.json"
          detect_scope zalo production-zalo "$RUNNER_TEMP/zalo-scope.json"

          node --input-type=module - "$RUNNER_TEMP/chatbotx-scope.json" \
            "$RUNNER_TEMP/zalo-scope.json" "$GITHUB_OUTPUT" <<'NODE'
          import { readFileSync, appendFileSync } from "node:fs";
          import { buildServiceMatrix } from "./scripts/deployment/detect-affected-services.mjs";
          const [chatbotxPath, zaloPath, outputPath] = process.argv.slice(2);
          const chatbotx = JSON.parse(readFileSync(chatbotxPath, "utf8"));
          const zalo = JSON.parse(readFileSync(zaloPath, "utf8"));
          const services = [...new Set([...chatbotx.services, ...zalo.services])];
          const baselineInclude = [];
          if (chatbotx.services.length) baselineInclude.push({ scope: "chatbotx", environment: "production-chatbotx" });
          if (zalo.services.includes("zalo-personal")) baselineInclude.push({ scope: "zalo", environment: "production-zalo" });
          appendFileSync(outputPath, [
            `has_services=${services.length > 0}`,
            `services=${services.join(",")}`,
            `chatbotx_services=${chatbotx.services.join(",")}`,
            `deploy_zalo=${zalo.services.includes("zalo-personal")}`,
            `matrix=${JSON.stringify(buildServiceMatrix(services))}`,
            `baseline_matrix=${JSON.stringify({ include: baselineInclude })}`,
            `full_deploy=${chatbotx.fullDeploy || zalo.fullDeploy}`,
            `reason=ChatbotX and Zalo use independent successful deployment baselines`,
            "",
          ].join("\n"));
          NODE

      - name: Summarize deployment scope
        env:
          HAS_SERVICES: ${{ steps.affected.outputs.has_services }}
          SERVICES: ${{ steps.affected.outputs.services }}
          FULL_DEPLOY: ${{ steps.affected.outputs.full_deploy }}
          REASON: ${{ steps.affected.outputs.reason }}
        run: |
          {
            echo "### Production deployment scope"
            echo "- Reason: $REASON"
            echo "- Full deployment: $FULL_DEPLOY"
            echo "- Services: ${SERVICES:-none}"
            echo "- Application deployment required: $HAS_SERVICES"
          } >> "$GITHUB_STEP_SUMMARY"

  build-image:
    name: Build ${{ matrix.label }}
    if: github.ref == 'refs/heads/dev' && needs.detect.outputs.has_services == 'true'
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: production-build-${{ matrix.label }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set lowercase image namespace
        id: image-namespace
        shell: bash
        run: echo "prefix=${DOCKER_REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Add swap for the builder compile
        if: matrix.label == 'builder'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          swap_gb=16
          reserve_gb=20
          swapfile=""
          for dir in /mnt /; do
            [ -d "$dir" ] || continue
            fstype=$(findmnt -n -o FSTYPE -T "$dir")
            free_gb=$(df -BG --output=avail "$dir" | tail -1 | tr -dc '0-9')
            if [ "$fstype" != "tmpfs" ] && [ "$free_gb" -ge $((swap_gb + reserve_gb)) ]; then
              swapfile="${dir%/}/ci-build.swap"
              break
            fi
          done
          if [ -z "$swapfile" ]; then
            echo "::warning::No disk has room for the optional ${swap_gb}G swapfile"
            exit 0
          fi
          sudo fallocate -l "${swap_gb}G" "$swapfile"
          sudo chmod 600 "$swapfile"
          sudo mkswap "$swapfile"
          sudo swapon "$swapfile"
          free -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for an existing commit image
        id: existing-image
        shell: bash
        run: |
          set -euo pipefail
          image="${{ steps.image-namespace.outputs.prefix }}/${{ matrix.image }}:sha-${{ github.sha }}"
          if lookup_output="$(docker buildx imagetools inspect "$image" 2>&1)"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Keeping existing commit image: $image"
          elif grep -Eqi 'manifest unknown|not found' <<<"$lookup_output"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No existing commit image: $image"
          else
            printf '%s\n' "$lookup_output" >&2
            echo "Could not determine whether $image already exists; refusing to overwrite it" >&2
            exit 1
          fi

      - name: Build and push commit image
        if: steps.existing-image.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: ${{ env.BUILD_PLATFORMS }}
          tags: |
            ${{ steps.image-namespace.outputs.prefix }}/${{ matrix.image }}:sha-${{ github.sha }}
            ${{ steps.image-namespace.outputs.prefix }}/${{ matrix.image }}:dev
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=production-${{ matrix.label }}
          cache-to: type=gha,scope=production-${{ matrix.label }},mode=min

  deploy:
    name: Activate production release
    if: >-
      github.ref == 'refs/heads/dev' &&
      needs.detect.outputs.has_services == 'true' &&
      needs.check.result == 'success' &&
      needs.build-image.result == 'success'
    needs:
      - check
      - detect
      - build-image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: chatbotx-production-deploy
      cancel-in-progress: false
    environment: production
    permissions:
      contents: read
    steps:
      - name: Configure deployment SSH key
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PROD_SSH_KEY" || { echo "Missing PROD_SSH_KEY" >&2; exit 1; }
          test -n "$PROD_SSH_KNOWN_HOSTS" || { echo "Missing PROD_SSH_KNOWN_HOSTS" >&2; exit 1; }
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PROD_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/chatbotx-production"
          printf '%s\n' "$PROD_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/chatbotx-production" "$HOME/.ssh/known_hosts"

      - name: Pull and activate release
        id: activate
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
          PROD_USER: ${{ secrets.PROD_USER }}
          RELEASE_SHA: ${{ github.sha }}
          DEPLOY_SERVICES: ${{ needs.detect.outputs.services }}
        shell: bash
        run: |
          set -euo pipefail
          : "${PROD_HOST:?Missing PROD_HOST}"
          : "${PROD_USER:?Missing PROD_USER}"
          PROD_PORT="${PROD_PORT:-22}"
          [[ "$PROD_PORT" =~ ^[0-9]+$ ]] || { echo "PROD_PORT must be numeric" >&2; exit 1; }
          [[ "$PROD_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] || { echo "Invalid PROD_USER" >&2; exit 1; }
          image_prefix="${DOCKER_REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}"

          ssh \
            -i "$HOME/.ssh/chatbotx-production" \
            -p "$PROD_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$PROD_USER@$PROD_HOST" \
            "bash -s -- '$RELEASE_SHA' '$image_prefix' '$DEPLOY_SERVICES'" <<'REMOTE'
          set -Eeuo pipefail
          release_sha="$1"
          image_prefix="$2"
          deploy_services="$3"
          cd /root/apps/ChatbotX

          [[ "$release_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Invalid release SHA" >&2
            exit 1
          }
          command -v flock >/dev/null || {
            echo "flock is required" >&2
            exit 1
          }
          exec 9>"${CHATBOTX_DEPLOY_LOCK:-/var/lock/chatbotx-production.lock}"
          flock -n 9 || {
            echo "Another production operation is already running" >&2
            exit 1
          }
          export CHATBOTX_DEPLOY_LOCK_FD=9

          git fetch --quiet origin dev
          remote_sha="$(git rev-parse origin/dev)"
          if [ "$remote_sha" != "$release_sha" ]; then
            echo "Skipping stale release $release_sha; origin/dev is now $remote_sha"
            exit 75
          fi
          git checkout dev
          git merge --ff-only "$release_sha"
          [ "$(git rev-parse HEAD)" = "$release_sha" ] || {
            echo "Checked-out release does not match the requested SHA" >&2
            exit 1
          }

          ./scripts/docker/production-full.sh pull-deploy \
            "$release_sha" "$image_prefix" "$deploy_services"
          REMOTE

      - name: Capture production status after a failed activation
        if: failure() && steps.activate.outcome == 'failure'
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
          PROD_USER: ${{ secrets.PROD_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/chatbotx-production" \
            -p "${PROD_PORT:-22}" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$PROD_USER@$PROD_HOST" \
            'cd /root/apps/ChatbotX && ./scripts/docker/production-full.sh status' \
            || true

      - name: Summarize successful activation
        if: success()
        env:
          DEPLOY_SERVICES: ${{ needs.detect.outputs.services }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          {
            echo "### Production activation succeeded"
            echo "- Services: $DEPLOY_SERVICES"
            echo "- Revision: $RELEASE_SHA"
            echo "- Backups, migrations, readiness, rollback state, and image retention completed on the host."
          } >> "$GITHUB_STEP_SUMMARY"

  record-successful-baseline:
    name: Record ${{ matrix.scope }} production baseline
    if: >-
      github.ref == 'refs/heads/dev' &&
      needs.detect.outputs.has_services == 'true' &&
      needs.deploy.result == 'success'
    needs:
      - detect
      - deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.baseline_matrix) }}
    environment: ${{ matrix.environment }}
    permissions:
      contents: read
    steps:
      - name: Record successful scope deployment
        env:
          DEPLOY_SCOPE: ${{ matrix.scope }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          {
            echo "### Successful production baseline"
            echo "- Scope: $DEPLOY_SCOPE"
            echo "- Revision: $RELEASE_SHA"
            echo "- Recorded only after the combined production activation succeeded."
          } >> "$GITHUB_STEP_SUMMARY"
